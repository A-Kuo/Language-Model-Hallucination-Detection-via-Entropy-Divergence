name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy scipy pytest

      - name: Run pytest suite (numpy/scipy-only; torch/openai tests skip cleanly)
        run: pytest tests -v

      - name: Run module self-tests
        env:
          PYTHONIOENCODING: utf-8
        run: |
          python feature_engineer.py
          python detector.py
          python data_generator.py
          python entropy_baselines.py
          python calibrated_entropy_detector.py
          python blackbox_detector.py
          python adversarial.py

      - name: Run synthetic pipeline
        env:
          PYTHONIOENCODING: utf-8
        run: |
          python pipeline.py --synthetic --num_samples 200
          python pipeline.py --synthetic --num_samples 200 --abstention
          python abstention.py --synthetic --num_samples 500
