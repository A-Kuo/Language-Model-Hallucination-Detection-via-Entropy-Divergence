name: Kaggle GPU Run

# Manual trigger ONLY. GPU kernel runs cost quota and time — this must never
# fire automatically on push. Run it from the Actions tab ("Run workflow")
# or `gh workflow run kaggle_runner.yml` when you deliberately want a run.
on:
  workflow_dispatch:
    inputs:
      kernel_dir:
        description: "Which notebook/kernel to run"
        required: true
        default: "notebooks"
        type: choice
        options:
          - "notebooks"
          - "notebooks/real_pipeline_benchmark"

permissions:
  contents: write

jobs:
  kaggle-run:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Kaggle CLI
        run: pip install kaggle

      - name: Push kernel to Kaggle
        env:
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
          KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
        run: kaggle kernels push -p "${{ inputs.kernel_dir }}/"

      - name: Poll for completion
        env:
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
          KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
        run: |
          SLUG=$(python -c "import json; print(json.load(open('${{ inputs.kernel_dir }}/kernel-metadata.json'))['id'])")
          echo "Polling kernel: $SLUG"
          for i in $(seq 1 170); do
            OUTPUT=$(kaggle kernels status "$SLUG")
            echo "  [$i] $OUTPUT"
            if echo "$OUTPUT" | grep -qi "complete"; then
              echo "Kernel finished."
              exit 0
            fi
            if echo "$OUTPUT" | grep -qiE "error|cancel"; then
              echo "Kernel failed."
              exit 1
            fi
            sleep 30
          done
          echo "Timed out waiting for kernel to finish."
          exit 1

      - name: Pull kernel output
        env:
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
          KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
        run: |
          SLUG=$(python -c "import json; print(json.load(open('${{ inputs.kernel_dir }}/kernel-metadata.json'))['id'])")
          if [ "${{ inputs.kernel_dir }}" = "notebooks" ]; then
            DEST="notebooks/results"
          else
            DEST="notebooks/results/$(basename "${{ inputs.kernel_dir }}")"
          fi
          mkdir -p "$DEST"
          kaggle kernels output "$SLUG" -p "$DEST"
          echo "DEST=$DEST" >> "$GITHUB_ENV"

      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "$DEST"
          git diff --cached --quiet && echo "No changes to commit" && exit 0
          git commit -m "chore: Kaggle GPU run results ($DEST)"
          git push
